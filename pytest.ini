# ============================================================
# pytest 配置 - 若依接口自动化框架
# ============================================================
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -v 详细输出；pytest-html + Allure 双报告
addopts =
    -v
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --clean-alluredir

# ---------------- 日志配置（双出口：文件 + 控制台）----------------
# 文件日志：logs/run.log（UTF-8 编码，避免中文乱码）
log_file = logs/run.log
log_file_level = INFO
log_file_format = %(lineno)s %(asctime)s %(filename)s [函数名:%(funcName)s] [%(levelname)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 控制台日志：随 pytest -v 一起输出
log_cli = True
log_cli_level = INFO
log_cli_format = %(lineno)s %(asctime)s %(filename)s [函数名:%(funcName)s] [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: 冒烟用例（登录+核心链路）
    user: 用户管理接口用例
    mock: 接口 Mock 演示用例（不依赖真实后端）

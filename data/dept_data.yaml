negative_cases:
  - title: 新增部门-缺少部门名称-应失败
    action: add
    payload:
      parentId: 103
      orderNum: 9
      status: "0"
    expected_code: 500
    expected_msg: 部门名称不能为空

  - title: 删除不存在部门-应失败
    action: delete
    dept_id: 999999
    expected_code: 500
    expected_msg: 操作失败
